version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sep-ai-remote-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - TZ=Asia/Ho_Chi_Minh
      - PAIRING_CODE=888999
      - JWT_SECRET=sep_ai_remote_super_secret_jwt_key_2026
      - DATABASE_FILE=/app/data/sep_ai.db
    volumes:
      - ./data:/app/data
      - ./uploads:/app/apps/backend/public/uploads
